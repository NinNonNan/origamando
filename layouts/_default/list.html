{{ define "main" }}

<section class="posts">

  <!-- 🌱 CONTENUTO DELLA SEZIONE (_index.md) -->
  {{ .Content }}

  <!-- 📚 LISTA POST -->
  {{ range .Pages }}

    <article class="post">

      <h2>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h2>

      <!-- 🧾 EXCERPT PERSONALIZZATO -->
      <div class="excerpt">
        {{ with .Params.excerpt }}
          {{ . }}
        {{ else }}
          {{ .Summary }}
        {{ end }}
      </div>

      <!-- 🔗 LINK READ MORE -->
      <a class="read-more" href="{{ .RelPermalink }}">
        Apri esperimento →
      </a>

    </article>

  {{ end }}

</section>

{{ end }}
