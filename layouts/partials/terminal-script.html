<script>
document.addEventListener("DOMContentLoaded", () => {

  const el = document.querySelector(".terminal-text");
  if (!el) return;

  const text = el.textContent;
  el.textContent = "";

  let i = 0;

  function type() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      setTimeout(type, 15);
    }
  }

  type();
});
</script>
